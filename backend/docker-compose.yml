# API loads backend/.env (set DATABASE_URL to Neon). Optional local Postgres: docker compose --profile local-db up
services:
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: facepay
      POSTGRES_PASSWORD: facepay
      POSTGRES_DB: facepay
    ports:
      - "5432:5432"
    volumes:
      - facepay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facepay -d facepay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "4000:3000"
    env_file:
      - .env

volumes:
  facepay_pg:
