# Detekt baseline for FacePay Android. See docs/android-plan.md §4.4.
config:
  validation: true

build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  LongMethod:
    active: true
    threshold: 140

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
  WildcardImport:
    active: false
  MagicNumber:
    excludes:
      - '**/core/designsystem/theme/Color.kt'
      - '**/core/designsystem/theme/FpCornerRadius.kt'
      - '**/core/network/ApiErrorMapper.kt'
      - '**/core/network/NetworkModule.kt'
      - '**/core/network/UnauthorizedInterceptor.kt'
      - '**/feature/auth/domain/validation/InputValidators.kt'

