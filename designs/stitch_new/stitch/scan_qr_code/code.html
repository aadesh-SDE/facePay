<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#301400",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#90d3cb",
                        "on-secondary-container": "#286d67",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-highest": "#e1e3e4",
                        "tertiary-container": "#8e5426",
                        "on-primary-container": "#9becf7",
                        "inverse-primary": "#82d3de",
                        "on-surface-variant": "#3e494a",
                        "surface-dim": "#d9dadb",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#004f56",
                        "on-tertiary-container": "#ffd7bd",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#6d390c",
                        "on-secondary-fixed-variant": "#00504b",
                        "tertiary": "#713d10",
                        "surface-container": "#edeeef",
                        "surface-tint": "#006972",
                        "surface": "#f8f9fa",
                        "outline": "#6f797a",
                        "on-surface": "#191c1d",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed": "#00201e",
                        "on-secondary": "#ffffff",
                        "background": "#f8f9fa",
                        "primary-fixed": "#9ff0fb",
                        "surface-container-low": "#f3f4f5",
                        "surface-bright": "#f8f9fa",
                        "on-primary-fixed": "#001f23",
                        "surface-container-high": "#e7e8e9",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdcc5",
                        "error-container": "#ffdad6",
                        "secondary": "#236863",
                        "secondary-container": "#a9ece5",
                        "primary-fixed-dim": "#82d3de",
                        "secondary-fixed": "#acefe7",
                        "primary": "#00535b",
                        "surface-variant": "#e1e3e4",
                        "primary-container": "#006d77",
                        "outline-variant": "#bec8ca",
                        "on-background": "#191c1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #9ff0fb, transparent);
            box-shadow: 0 0 15px 2px #9ff0fb;
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black font-body text-on-surface antialiased">
<!-- Viewfinder Background -->
<div class="fixed inset-0 z-0">
<img alt="Background" class="h-full w-full object-cover opacity-60 blur-sm brightness-[0.4]" data-alt="Modern retail environment interior blurred in background with deep teal and charcoal lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJy4qbS1uu99fdQtqhDHtF9G5Y-idvmPzYgKKBW9mjdLVsYXz3SGQy4y8jZfEKb0-Tee3k8dznerFdU0WX1a8CAj_1trdV4JnODaJmQIBGFgVJZAMfc11YMzJQXQihMJiihpOTdFMlzyylSZymtPP1Yht7NG6b2-pFavMfRZNEIiQSZbAJKILXqovLnByfp3VXDS5bwDpJ0Eoswv464p561qFgLeqrAQQeAsssd7uGV_6jzDO9OK-grR9M6rQ5olKDv4SG7hTKzVbv"/>
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
</div>
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl shadow-[0_8px_24px_rgba(0,0,0,0.06)]">
<div class="flex items-center px-6 h-16 w-full justify-between">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full active:scale-95 duration-200 text-teal-900 dark:text-teal-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-manrope text-lg font-bold tracking-tight text-teal-900 dark:text-teal-100">Scan QR</h1>
<div class="text-teal-800 dark:text-teal-200 font-extrabold tracking-tight">FacePay</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-8 pt-16 pb-32">
<!-- QR Scanning Frame -->
<div class="relative w-64 h-64 md:w-80 md:h-80">
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 w-10 h-10 border-t-4 border-l-4 border-primary-fixed rounded-tl-2xl"></div>
<div class="absolute -top-1 -right-1 w-10 h-10 border-t-4 border-r-4 border-primary-fixed rounded-tr-2xl"></div>
<div class="absolute -bottom-1 -left-1 w-10 h-10 border-b-4 border-l-4 border-primary-fixed rounded-bl-2xl"></div>
<div class="absolute -bottom-1 -right-1 w-10 h-10 border-b-4 border-r-4 border-primary-fixed rounded-br-2xl"></div>
<!-- Transparent Hole for Scan -->
<div class="w-full h-full rounded-2xl border-2 border-white/20 overflow-hidden relative">
<div class="scan-line"></div>
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<span class="material-symbols-outlined text-white text-8xl scale-150" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
</div>
</div>
<!-- Floating Info Card -->
<div class="mt-12 w-full max-w-[340px] bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl text-center flex flex-col items-center gap-3">
<p class="text-on-surface-variant font-medium leading-relaxed">
                Point camera at a FacePay QR code
            </p>
<button class="text-primary font-bold text-sm tracking-wide py-2 px-4 rounded-full hover:bg-primary/5 active:scale-95 transition-all">
                Or enter mobile number
            </button>
</div>
</main>
<!-- Bottom Actions -->
<footer class="fixed bottom-0 left-0 right-0 p-8 z-20 flex flex-col items-center">
<button class="flex items-center gap-2 px-6 py-3 rounded-full border border-white/30 bg-white/10 backdrop-blur-sm text-white font-semibold text-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-xl" data-icon="help">help</span>
            Having trouble?
        </button>
<!-- Home Indicator Area -->
<div class="mt-6 w-32 h-1.5 bg-white/30 rounded-full mx-auto"></div>
</footer>
</body></html>
