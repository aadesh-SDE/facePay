<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0" name="viewport"/>
<title>FacePay Login</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "outline": "#6f797a",
                        "primary": "#00535b",
                        "on-secondary-container": "#286d67",
                        "surface-bright": "#f8f9fa",
                        "error-container": "#ffdad6",
                        "secondary-container": "#a9ece5",
                        "primary-fixed": "#9ff0fb",
                        "outline-variant": "#bec8ca",
                        "on-tertiary-container": "#ffd7bd",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "secondary-fixed": "#acefe7",
                        "surface": "#f8f9fa",
                        "on-primary-fixed": "#001f23",
                        "on-primary-container": "#9becf7",
                        "primary-container": "#006d77",
                        "on-tertiary-fixed-variant": "#6d390c",
                        "on-primary-fixed-variant": "#004f56",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1d",
                        "tertiary-fixed": "#ffdcc5",
                        "inverse-primary": "#82d3de",
                        "surface-variant": "#e1e3e4",
                        "error": "#ba1a1a",
                        "tertiary": "#713d10",
                        "inverse-surface": "#2e3132",
                        "tertiary-container": "#8e5426",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#3e494a",
                        "primary-fixed-dim": "#82d3de",
                        "on-surface": "#191c1d",
                        "on-secondary-fixed-variant": "#00504b",
                        "on-secondary": "#ffffff",
                        "secondary": "#236863",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary": "#ffffff",
                        "surface-tint": "#006972",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e7e8e9",
                        "background": "#f8f9fa",
                        "on-tertiary-fixed": "#301400",
                        "secondary-fixed-dim": "#90d3cb",
                        "on-secondary-fixed": "#00201e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe-offset-2 {
            padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #00535b 0%, #006d77 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50/70 dark:bg-slate-900/70 backdrop-blur-xl">
<div class="flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors p-2 rounded-full scale-95 duration-200">
<span class="material-symbols-outlined text-teal-900 dark:text-teal-100">arrow_back</span>
</button>
<span class="font-manrope font-extrabold text-teal-800 dark:text-teal-200 tracking-tighter text-lg">FacePay</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering logic if needed -->
</div>
</header>
<main class="flex-1 pt-24 pb-12 px-8 flex flex-col relative">
<!-- Background Decorations -->
<div class="absolute top-20 -right-20 w-64 h-64 bg-secondary-container/10 blur-[80px] rounded-full -z-10"></div>
<div class="absolute bottom-40 -left-20 w-72 h-72 bg-primary-container/10 blur-[100px] rounded-full -z-10"></div>
<!-- Hero Section -->
<section class="flex flex-col items-center text-center mb-12">
<div class="w-20 h-20 bg-primary-container rounded-3xl flex items-center justify-center mb-8 shadow-lg">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-medium">Login to your FacePay account</p>
</section>
<!-- Form Section -->
<form class="space-y-6 flex-1">
<!-- Mobile Number -->
<div class="space-y-2">
<label class="block text-[10px] font-extrabold tracking-[0.15em] text-outline px-1">MOBILE NUMBER</label>
<div class="relative flex items-center bg-surface-container-highest rounded-xl px-4 h-14 group focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-xl">phone</span>
<span class="text-on-surface-variant font-bold mr-2 text-sm border-r border-outline-variant pr-2">+91</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-semibold placeholder:text-outline-variant text-sm" placeholder="00000 00000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-[10px] font-extrabold tracking-[0.15em] text-outline px-1">PASSWORD</label>
<div class="relative flex items-center bg-surface-container-highest rounded-xl px-4 h-14 group focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-outline mr-3 text-xl">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-semibold placeholder:text-outline-variant text-sm" placeholder="••••••••" type="password"/>
<button class="text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="text-sm font-bold text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
<!-- Login CTA -->
<div class="pt-4">
<button class="w-full bg-login-gradient text-on-primary h-14 rounded-xl font-bold shadow-xl shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<footer class="mt-12 text-center pb-8">
<p class="text-on-surface-variant font-medium text-sm">
                Don't have an account? 
                <a class="text-primary font-extrabold ml-1 hover:underline" href="#">Sign Up</a>
</p>
<!-- Biometric Decoration -->
<div class="mt-12 flex justify-center gap-8 opacity-10">
<span class="material-symbols-outlined text-3xl">fingerprint</span>
<span class="material-symbols-outlined text-3xl">face</span>
<span class="material-symbols-outlined text-3xl">key</span>
</div>
</footer>
</main>
<!-- Bottom Decoration Blur -->
<div class="fixed bottom-0 right-0 w-32 h-32 bg-secondary/5 blur-[40px] rounded-full pointer-events-none"></div>
</body></html>
