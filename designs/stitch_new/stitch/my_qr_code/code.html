<header class="fixed top-0 w-full z-50 bg-slate-50/70 dark:bg-slate-900/70 backdrop-blur-xl flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">

<h1 class="font-manrope font-extrabold text-teal-800 dark:text-teal-200 tracking-tighter text-lg">FacePay</h1>

<div class="w-64 h-64 bg-white p-4 rounded-3xl shadow-sm flex items-center justify-center relative">

<div class="bg-white p-1.5 rounded-xl shadow-lg border border-surface-container">
<div class="bg-primary-container p-1 rounded-lg">
<span class="material-symbols-outlined text-white text-sm" data-icon="face" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
</div>
</div>
</div>
</div>

<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full mb-8">
<span class="text-lg font-bold text-primary tracking-tight">arjun.demo@facepay</span>
<button class="flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-base" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>

<span class="material-symbols-outlined" data-icon="share">share</span>

<span class="material-symbols-outlined text-2xl mb-0.5" data-icon="person">person</span>
